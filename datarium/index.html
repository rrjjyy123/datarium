<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}</style>
<title>데이터리움</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: full-bleed WebGL stage; HUD hugs the edges like a field scanner; dialog and data panels dock low like a handheld terminal */
:root{
  --ink:#070b0e;          /* night-archive ground */
  --panel:rgba(9,16,21,.92);
  --panel-2:#111d24;
  --line:#264049;
  --text:#e3edef;
  --muted:#8da4ab;
  --amber:#ffb13b;        /* scanner beam: the one bold accent */
  --cyan:#5ad8ea;         /* Bit, data */
  --ok:#8bd67f;
  --bad:#ff6d5a;
  --core:#ff4d6d;
  --f-display:'Do Hyeon','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sb:env(safe-area-inset-bottom,0px);
  --st:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#app{position:fixed;inset:0;overflow:hidden}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:10}
#obj{position:absolute;left:16px;top:calc(14px + var(--st));max-width:min(420px,calc(100% - 140px));background:linear-gradient(90deg,rgba(7,11,14,.85),rgba(7,11,14,0));padding:10px 16px 10px 12px;border-left:3px solid var(--amber)}
#obj .k{font:600 10px/1 var(--f-mono);letter-spacing:.18em;color:var(--amber);text-transform:uppercase}
#obj .v{font-size:15px;line-height:1.45;margin-top:5px;text-wrap:balance}
#reticle{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);transition:width .15s,height .15s}
#reticle::before{content:"";position:absolute;left:50%;top:50%;width:4px;height:4px;margin:-2px;border-radius:50%;background:rgba(227,237,239,.85)}
#reticle i{position:absolute;width:9px;height:9px;border:2px solid rgba(227,237,239,.35);transition:border-color .15s}
#reticle i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}
#reticle i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
#reticle i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}
#reticle i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
#reticle.lock{width:54px;height:54px}
#reticle.lock i{border-color:var(--amber)}
#prompt{position:absolute;left:50%;top:calc(50% + 40px);transform:translateX(-50%);font:600 13px/1 var(--f-mono);color:var(--amber);background:rgba(7,11,14,.72);padding:7px 10px;white-space:nowrap;letter-spacing:.02em}
#prompt b{display:inline-block;border:1px solid var(--amber);padding:1px 5px;margin-right:6px;font-weight:600}
#tray{position:absolute;left:50%;bottom:calc(18px + var(--sb));transform:translateX(-50%);display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);padding:8px 14px;font:500 12px/1.2 var(--f-mono);color:var(--muted);max-width:calc(100% - 32px)}
#tray .dots{display:flex;gap:4px;flex-wrap:wrap}
#tray .dot{width:12px;height:12px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35)}
#tray .dot.ap{outline:2px solid var(--amber);outline-offset:1px}
#tray strong{color:var(--text);font-weight:600}
#topbtns{position:absolute;right:16px;top:calc(14px + var(--st));display:flex;gap:8px;pointer-events:auto}
.hbtn{background:var(--panel);border:1px solid var(--line);padding:8px 12px;font:600 12px/1 var(--f-mono);color:var(--text);letter-spacing:.04em}
.hbtn:hover{border-color:var(--amber)}
#toast{position:absolute;left:50%;top:calc(76px + var(--st));transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:9px 14px;font-size:13px;max-width:calc(100% - 32px);text-align:center;transition:opacity .3s}
#banner{position:absolute;inset:0;display:grid;place-items:center;z-index:25;pointer-events:none;text-align:center;padding-inline:16px}
#banner .s{font:600 12px/1 var(--f-mono);letter-spacing:.3em;color:var(--amber)}
#banner .t{font:400 clamp(40px,8vw,84px)/1.05 var(--f-display);margin-top:14px;text-shadow:0 0 30px rgba(255,177,59,.35)}
#banner .d{margin-top:12px;color:var(--muted);font-size:15px}
#banner.show{animation:bannerIn 3.4s ease forwards}
@keyframes bannerIn{0%{opacity:0;transform:scale(1.04)}15%{opacity:1;transform:none}75%{opacity:1}100%{opacity:0}}
#scanfx{position:absolute;inset:0;z-index:15;pointer-events:none;opacity:0;background:repeating-linear-gradient(0deg,rgba(255,177,59,.0) 0 3px,rgba(255,177,59,.07) 3px 4px)}
#scanfx::after{content:"";position:absolute;left:0;right:0;height:22%;background:linear-gradient(180deg,rgba(255,177,59,0),rgba(255,177,59,.22),rgba(255,177,59,0));top:-22%}
#scanfx.on{animation:scanOn .5s ease}
#scanfx.on::after{animation:sweep .5s ease}
@keyframes scanOn{0%,100%{opacity:0}20%,70%{opacity:1}}
@keyframes sweep{to{top:100%}}
#fade{position:absolute;inset:0;background:#000;z-index:20;pointer-events:none;opacity:1;transition:opacity .8s}
#hurt{position:absolute;inset:0;z-index:16;pointer-events:none;box-shadow:inset 0 0 160px rgba(255,77,109,.0);transition:box-shadow .3s}
#hurt.on{box-shadow:inset 0 0 160px rgba(255,77,109,.7)}
body.glitch #app{animation:glitch .5s steps(2) 2}
@keyframes glitch{0%{filter:none;transform:none}25%{filter:hue-rotate(90deg) saturate(3);transform:translate(4px,-2px)}50%{filter:invert(1);transform:translate(-6px,1px)}75%{filter:hue-rotate(-60deg);transform:translate(2px,3px)}100%{filter:none;transform:none}}

/* ---------- touch ---------- */
#touch{position:absolute;inset:0;z-index:12;pointer-events:none}
#joy{position:absolute;left:calc(22px + env(safe-area-inset-left,0px));bottom:calc(26px + var(--sb));width:132px;height:132px;border-radius:50%;border:2px solid rgba(227,237,239,.22);background:rgba(7,11,14,.35);pointer-events:auto;touch-action:none}
#knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px;border-radius:50%;background:rgba(227,237,239,.28);border:2px solid rgba(227,237,239,.5)}
#tbtns{position:absolute;right:calc(20px + env(safe-area-inset-right,0px));bottom:calc(30px + var(--sb));display:flex;flex-direction:column;align-items:flex-end;gap:12px;pointer-events:auto}
#btnScan{width:92px;height:92px;border-radius:50%;border:2px solid var(--amber);background:rgba(255,177,59,.18);font:400 22px/1 var(--f-display);color:var(--amber);touch-action:none}
#btnRun{width:62px;height:62px;border-radius:50%;border:2px solid rgba(227,237,239,.4);background:rgba(7,11,14,.4);font:600 12px/1 var(--f-mono);touch-action:none}
#btnRun.on{border-color:var(--cyan);color:var(--cyan)}

/* ---------- dialog ---------- */
#dialog{position:absolute;left:50%;bottom:calc(18px + var(--sb));transform:translateX(-50%);width:min(760px,calc(100% - 32px));z-index:30;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:start;background:var(--panel);border:1px solid var(--line);padding:16px 18px 14px;cursor:pointer;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#dialog.core{border-color:rgba(255,77,109,.6)}
#dialog.sys{grid-template-columns:1fr}
#dialog.sys .pt{display:none}
#dName{font:400 20px/1 var(--f-display);color:var(--cyan);letter-spacing:.02em}
#dialog.core #dName{color:var(--core)}
#dialog.havi #dName{color:var(--amber)}
#dialog.sort #dName{color:#c8d2d6}
#dialog.me #dName{color:var(--text)}
#dText{font-size:17px;line-height:1.65;margin-top:8px;min-height:3.3em;white-space:pre-line;word-break:keep-all;overflow-wrap:anywhere}
#dialog.sys #dText{color:#c9d6d9;font-style:italic;margin-top:0}
#dNext{font:600 11px/1 var(--f-mono);color:var(--muted);text-align:right;margin-top:6px;letter-spacing:.08em;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.3}}
#dChoices{display:grid;gap:8px;margin-top:12px}
.choice{text-align:left;background:var(--panel-2);border:1px solid var(--line);padding:11px 14px;font-size:15px;line-height:1.45}
.choice:hover,.choice:focus-visible{border-color:var(--amber);color:var(--amber)}
.dmain{min-width:0}

/* portraits */
.pt{width:64px;height:64px;border-radius:50%;position:relative;flex:none;background:#1a262c;border:2px solid var(--line)}
.pt.bit{background:radial-gradient(circle at 50% 58%,#0c1418 0 22px,transparent 23px),radial-gradient(circle at 38% 30%,#fff,#cfdde0 60%,#9fb3b8);border-color:var(--cyan)}
.pt.bit::after{content:"";position:absolute;left:50%;top:58%;width:14px;height:14px;margin:-7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px var(--cyan)}
.pt.core{background:radial-gradient(circle,#2a0710 0 12px,var(--core) 13px 17px,#1a0509 18px);border-color:var(--core);box-shadow:0 0 18px rgba(255,77,109,.5)}
.pt.sort{background:linear-gradient(#6f7a80,#4b555a);border-radius:10px}
.pt.sort::after{content:"";position:absolute;left:12px;right:12px;top:26px;height:8px;background:var(--core);box-shadow:0 0 10px var(--core)}
.pt.havi{background:radial-gradient(circle at 50% 45%,#2b1a05 0 13px,transparent 14px),linear-gradient(#f0a53a,#b86d16);border-color:var(--amber)}
.pt.havi::after{content:"";position:absolute;left:50%;top:45%;width:12px;height:12px;margin:-6px;border-radius:50%;background:var(--pt-eye,#ff6d5a);box-shadow:0 0 10px var(--pt-eye,#ff6d5a)}
.pt.me{background:radial-gradient(circle at 50% 38%,#e3edef 0 11px,transparent 12px),radial-gradient(ellipse at 50% 100%,#e3edef 0 22px,transparent 23px),#1a262c}

/* ---------- panel ---------- */
#panel{position:absolute;inset:0;z-index:40;display:grid;place-items:center;background:rgba(3,6,8,.55);padding:16px;overflow:auto}
#panelCard{width:min(640px,100%);max-height:calc(100% - 8px);overflow:auto;background:var(--panel);border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);display:flex;flex-direction:column}
#panel.wide #panelCard{width:min(880px,100%)}
#panelBody{padding:20px 22px 8px;min-width:0}
#panelBtns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:12px 22px 18px}
.btn{background:var(--panel-2);border:1px solid var(--line);padding:11px 18px;font-weight:500;font-size:15px}
.btn:hover{border-color:var(--text)}
.btn.pri{background:var(--amber);border-color:var(--amber);color:#1b1102;font-weight:700}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:6px 10px;font-size:13px}
.eyebrow{font:600 11px/1 var(--f-mono);letter-spacing:.2em;color:var(--amber);text-transform:uppercase}
.ph{font:400 30px/1.15 var(--f-display);margin:10px 0 6px;text-wrap:balance}
.pp{color:#c3d1d5;line-height:1.7;font-size:15px;max-width:62ch;word-break:keep-all}
.card{border:1px solid var(--line);background:var(--panel-2);padding:14px 16px;margin-top:14px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-top:10px}
.kv dt{font:500 12px/1.6 var(--f-mono);color:var(--muted)}
.kv dd{margin:0}
.mono{font-family:var(--f-mono)}
.warn{color:var(--bad)}
.okc{color:var(--ok)}
.bars{display:grid;gap:8px;margin-top:10px}
.bar{display:grid;grid-template-columns:7.5em 1fr 3.2em;gap:10px;align-items:center;font-size:13px}
.bar .tr{height:12px;background:#0a1216;border:1px solid var(--line);position:relative;overflow:hidden}
.bar .fl{position:absolute;left:0;top:0;bottom:0}
.bar .n{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font:500 12px/1 var(--f-mono);border:1px solid var(--line);padding:6px 8px;background:#0c161b}
.chip.on{border-color:var(--amber);color:var(--amber)}
.samples{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px;margin-top:12px}
.smp{border:1px solid var(--line);background:var(--panel-2);padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;min-width:0}
.smp .sw{width:26px;height:26px;border-radius:50%;grid-row:span 2}
.smp .id{font:600 12px/1 var(--f-mono);color:var(--muted)}
.smp .ft{font-size:12px;color:#b5c5ca;line-height:1.4}
.smp .ac{grid-column:1/-1;display:flex;gap:6px;margin-top:6px}
.lab{font:700 12px/1 var(--f-body);padding:5px 8px;border:1px solid}
.lab.apple{color:var(--amber);border-color:var(--amber)}
.lab.not{color:#b9c6ca;border-color:#50646b}
.tbl-wrap{overflow-x:auto;margin-top:12px}
table.res{border-collapse:collapse;width:100%;font-size:14px;min-width:520px}
table.res th,table.res td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left;vertical-align:top}
table.res th{font:600 11px/1.2 var(--f-mono);color:var(--muted);letter-spacing:.08em}
.fspace{display:block;width:100%;height:auto;margin-top:12px;border:1px solid var(--line);background:#081014}
.featgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin-top:12px}
.feat{border:1px solid var(--line);padding:10px;background:#0c161b}
.feat .k{font:600 11px/1 var(--f-mono);color:var(--muted);letter-spacing:.06em}
.feat .v{font-size:17px;margin-top:6px}
.real{border-left:3px solid var(--cyan);padding-left:14px}
.cert{border:1px solid var(--amber);padding:22px;background:radial-gradient(circle at 100% 0,rgba(255,177,59,.12),transparent 50%),var(--panel-2)}
.cert .nm{font:400 40px/1.1 var(--f-display);margin-top:8px}

/* ---------- screens ---------- */
#screen{position:absolute;inset:0;z-index:50;display:grid;place-items:center;padding:24px 16px;text-align:center;overflow:auto}
#screen.dim{background:rgba(3,6,8,.55)}
#screen.black{background:#000}
.logo{font:400 clamp(56px,13vw,132px)/.95 var(--f-display);letter-spacing:-.01em;background:linear-gradient(180deg,#fff 30%,#ffcf85);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 30px rgba(255,177,59,.25))}
.logo-sub{font:600 13px/1 var(--f-mono);letter-spacing:.5em;color:var(--amber);margin-top:14px;padding-left:.5em}
.tag{color:#c3d1d5;margin:22px auto 0;max-width:34em;line-height:1.75;font-size:15px;word-break:keep-all}
.menu{display:flex;flex-direction:column;gap:10px;align-items:center;margin-top:30px}
.menu .btn{min-width:220px}
.linkbtn{background:none;border:0;color:var(--muted);font:500 13px/1 var(--f-mono);text-decoration:underline;text-underline-offset:4px;margin-top:10px}
.typed{font-size:clamp(17px,2.4vw,21px);line-height:1.9;max-width:30em;margin:0 auto;white-space:pre-line;word-break:keep-all;min-height:6em}
.caret::after{content:"▍";color:var(--amber);animation:blink 1s infinite}
#nameIn{background:transparent;border:0;border-bottom:2px solid var(--line);color:var(--text);font:400 34px/1.2 var(--f-display);text-align:center;padding:8px 4px;width:min(360px,100%);outline:none}
#nameIn:focus{border-color:var(--amber)}
.note{color:var(--muted);font-size:12.5px;line-height:1.6;margin-top:14px}
.ctrls{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:13px;color:#c3d1d5;margin:20px auto 0;max-width:340px}
.ctrls kbd{font:600 11px/1 var(--f-mono);border:1px solid var(--line);padding:3px 6px;color:var(--text);white-space:nowrap}
.scene-list{display:grid;gap:8px;margin-top:18px;min-width:min(320px,100%)}
@media (max-width:560px){
  #dialog{grid-template-columns:1fr;gap:6px;padding:12px 14px}
  #dialog .pt{display:none}
  #dText{font-size:15.5px}
  #obj .v{font-size:13.5px}
  #tray{bottom:calc(170px + var(--sb))}
}
@media (prefers-reduced-motion:reduce){
  #banner.show{animation-duration:2.4s}
  body.glitch #app{animation:none}
  #scanfx.on,#scanfx.on::after{animation:none}
}
</style>

<div id="app">
  <canvas id="gl" aria-label="3D 게임 화면"></canvas>
  <div id="hud" hidden>
    <div id="obj"><div class="k">현재 목표</div><div class="v" id="objText"></div></div>
    <div id="reticle"><i></i><i></i><i></i><i></i></div>
    <div id="prompt" hidden></div>
    <div id="tray" hidden></div>
    <div id="toast" hidden></div>
    <div id="topbtns">
      <button class="hbtn" id="btnData" hidden>데이터셋 <span class="mono">[Q]</span></button>
      <button class="hbtn" id="btnMenu">메뉴</button>
    </div>
  </div>
  <div id="scanfx"></div>
  <div id="hurt"></div>
  <div id="touch" hidden>
    <div id="joy"><div id="knob"></div></div>
    <div id="tbtns">
      <button id="btnRun" aria-label="달리기">달리기</button>
      <button id="btnScan" aria-label="스캔">스캔</button>
    </div>
  </div>
  <div id="fade"></div>
  <div id="banner" hidden><div><div class="s" id="bS"></div><div class="t" id="bT"></div><div class="d" id="bD"></div></div></div>
  <div id="dialog" hidden>
    <div class="pt" id="dPt"></div>
    <div class="dmain">
      <div id="dName"></div>
      <div id="dText"></div>
      <div id="dChoices" hidden></div>
      <div id="dNext" hidden>▼ 클릭 · Space</div>
    </div>
  </div>
  <div id="panel" hidden><div id="panelCard"><div id="panelBody"></div><div id="panelBtns"></div></div></div>
  <div id="screen"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===================== 데이터리움 · engine ===================== */
'use strict';
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function josa(word, a, b) { const c = word.charCodeAt(word.length - 1); if (c < 0xAC00 || c > 0xD7A3) return word + b; return word + (((c - 0xAC00) % 28) ? a : b); }

const G = { name: '탐사원', lock: 0, playing: false, stage: null, sens: 1, run: false, touch: false };
const fmt = t => String(t).replace(/\{name\}/g, G.name);

/* ---------- save ---------- */
const Save = {
  get() { try { return JSON.parse(localStorage.getItem('datarium-v1') || '{}'); } catch (e) { return {}; } },
  set(o) { try { localStorage.setItem('datarium-v1', JSON.stringify(Object.assign(Save.get(), o))); } catch (e) { } }
};

/* ---------- sound (WebAudio synth, no files) ---------- */
const Snd = {
  ctx: null, on: true, amb: [],
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.master = this.ctx.createGain(); this.master.gain.value = .5; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; }
  },
  tone(f, d = .12, type = 'sine', v = .2, slide = 0, delay = 0) {
    if (!this.ctx || !this.on) return;
    const t = this.ctx.currentTime + delay, o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .05);
  },
  play(n) {
    switch (n) {
      case 'type': this.tone(1500, .018, 'square', .015); break;
      case 'blip': this.tone(880, .05, 'square', .05); break;

/* ---------- fruit & feature model ---------- */
const TYPES = {
  red_apple: { n: '빨간 사과', color: '빨강', hex: 0xb8202a, css: '#c0272f', stem: 1, calyx: 0, seam: 0, oval: 0, apple: true },
  green_apple: { n: '초록 사과', color: '초록', hex: 0x86c440, css: '#86c440', stem: 1, calyx: 0, seam: 0, oval: 0, apple: true },
  yellow_apple: { n: '노란 사과', color: '노랑', hex: 0xe8c233, css: '#e8c233', stem: 1, calyx: 0, seam: 0, oval: 0, apple: true },
  tomato: { n: '토마토', color: '빨강', hex: 0xe0341c, css: '#e0341c', stem: 0, calyx: 1, seam: 0, oval: 0, apple: false },
  lime: { n: '라임', color: '초록', hex: 0x4f9a2a, css: '#4f9a2a', stem: 0, calyx: 0, seam: 0, oval: 0, apple: false },
  lemon: { n: '레몬', color: '노랑', hex: 0xf3d63a, css: '#f3d63a', stem: 0, calyx: 0, seam: 0, oval: 1, apple: false },
  red_ball: { n: '빨간 공', color: '빨강', hex: 0xd11f2c, css: '#d11f2c', stem: 0, calyx: 0, seam: 1, oval: 0, apple: false },
  tennis: { n: '테니스공', color: '초록', hex: 0x9fd23a, css: '#9fd23a', stem: 0, calyx: 0, seam: 1, oval: 0, apple: false }
};
function featureVec(type) { const T = TYPES[type]; const c = { 빨강: [1, 0, 0], 초록: [0, 1, 0], 노랑: [0, 0, 1] }[T.color]; return [...c, T.stem * 1.2, T.calyx * 1.2, T.seam * 1.2, T.oval * .5]; }
function fdist(a, b) { let s = 0; for (let i = 0; i < a.length; i++) s += (a[i] - b[i]) ** 2; return Math.sqrt(s); }
/* 1-최근접 이웃: 가장 닮은 학습 데이터의 라벨을 따른다 (동점이면 다수결) */
function predict(type, data) {
  const f = featureVec(type); let best = Infinity, cands = [];
  for (const s of data) { const d = fdist(f, featureVec(s.type)); if (d < best - 1e-6) { best = d; cands = [s]; } else if (Math.abs(d - best) < 1e-6) cands.push(s); }
  if (!cands.length) return { label: 'not', nn: null, d: Infinity };
  const yes = cands.filter(s => s.label === 'apple').length;
  const label = yes * 2 > cands.length ? 'apple' : yes * 2 < cands.length ? 'not' : cands[0].label;
  return { label, nn: cands.find(s => s.label === label), d: best, ties: cands.length };
}
function featText(type) { const T = TYPES[type]; return [`색 ${T.color}`, T.stem ? '꼭지 있음' : '꼭지 없음', T.calyx ? '별 모양 꽃받침' : null, T.seam ? '이음선 무늬' : null, T.oval ? '길쭉한 모양' : '둥근 모양'].filter(Boolean); }

function makeFruit(type, s = 1) {
  const T = TYPES[type], g = new THREE.Group(), mat = M(T.hex, { roughness: T.seam ? .3 : .42, metalness: 0 });
  const green = M(0x3d7a2a, { roughness: .6 }), brown = M(0x5a3a1c);
  let body, h;
  if (type === 'lemon') {
    body = new THREE.Mesh(new THREE.SphereGeometry(.12, 24, 16), mat); body.scale.set(1.15, .82, .82); h = .1;
    for (const d of [-1, 1]) { const c = new THREE.Mesh(new THREE.ConeGeometry(.03, .06, 12), mat); c.rotation.z = -d * Math.PI / 2; c.position.x = d * .155; body.add(c); c.scale.set(1 / 1.15, 1 / .82, 1 / .82); }

    for (let i = 0; i < 5; i++) { const l = new THREE.Mesh(new THREE.BoxGeometry(.09, .012, .025), green); const a = i / 5 * Math.PI * 2; l.position.set(Math.cos(a) * .04, .12, Math.sin(a) * .04); l.rotation.y = -a; l.scale.set(1, 1 / .78, 1); body.add(l); }

    if (type === 'tennis') { for (const d of [-1, 1]) { const t = new THREE.Mesh(new THREE.TorusGeometry(.085, .006, 6, 32), seamM); t.position.x = d * .045; t.rotation.y = Math.PI / 2 + d * .25; body.add(t); } }
    else { const t = new THREE.Mesh(new THREE.TorusGeometry(.111, .006, 6, 40), seamM); t.rotation.x = Math.PI / 2; body.add(t); const t2 = t.clone(); t2.rotation.set(0, 0, 0); body.add(t2); }
  } else {
    body = new THREE.Mesh(new THREE.SphereGeometry(.12, 24, 16), mat); body.scale.y = .92; h = .11;
    const st = new THREE.Mesh(new THREE.CylinderGeometry(.006, .009, .07), brown); st.position.y = .135; st.rotation.z = .2; body.add(st);
    const lf = new THREE.Mesh(new THREE.SphereGeometry(.05, 10, 6), green); lf.scale.set(1, .12, .45); lf.position.set(.035, .15, 0); lf.rotation.z = .5; body.add(lf);
  }
  body.castShadow = true; body.position.y = h; g.add(body); g.scale.setScalar(s); g.userData.type = type;
  return g;
}

function typeInto(el, text, speed = 42) {
  return new Promise(res => {
    let i = 0, done = false; el.textContent = '';
    const fin = () => { if (done) return; done = true; el.textContent = text; el.classList.remove('caret'); $('#screen').removeEventListener('click', fin); res(); };
    $('#screen').addEventListener('click', fin);
    const st = () => { if (done) return; i++; el.textContent = text.slice(0, i); if (i % 2 === 0) Snd.play('type'); if (i < text.length) setTimeout(st, text[i - 1] === '\n' ? 420 : speed); else fin(); };
    el.classList.add('caret'); st();
  });
}
const clickOnce = el => new Promise(r => el.addEventListener('click', () => { Snd.play('blip'); r(); }, { once: true }));

async function quiz(who, q, opts, ans, wrong, right) {
  for (; ;) {
    const k = await choose(who, q, opts);
    if (k === ans) { Snd.play('ok'); for (const l of right) await talk('bit', l); return; }

  }

    return `<div class="bar"><span>${c}</span><span class="tr"><span class="fl" style="width:${ap / max * 100}%;background:var(--amber)"></span><span class="fl" style="left:${ap / max * 100}%;width:${no / max * 100}%;background:#50646b"></span></span><span class="n">${ap}·${no}</span></div>`; }).join('');
  const apColors = [...new Set(a.map(s => TYPES[s.type].color))];
  const notes = [];
  if (n && !a.length) notes.push('「사과」 라벨이 붙은 데이터가 하나도 없어요.');
  if (n && a.length === n) notes.push('「사과 아님」 데이터가 없어요. 하비가 무엇이 사과가 아닌지 배울 수 없어요.');
  if (a.length) notes.push(`「사과」 라벨이 붙은 색: <b>${apColors.join(', ')}</b>`);
  const cards = d.map(s => `<div class="smp"><span class="sw" style="background:${TYPES[s.type].css}"></span><span class="id">#${String(s.id).padStart(2, '0')}</span><span class="ft">${featText(s.type).join(' · ')}</span>
      <div class="ac"><span class="lab ${s.label}">${LAB(s.label)}</span><button class="btn sm" data-flip="${s.id}">라벨 바꾸기</button><button class="btn sm" data-del="${s.id}">빼기</button></div></div>`).join('');
  return `<div class="eyebrow">${atTerm ? '학습 단말기 · HAVI RETRAIN' : '내 데이터셋'}</div><div class="ph">하비의 새 학습 데이터</div>
    <p class="pp">샘플 <b>${n}</b>개 · 사과 <b>${a.length}</b> · 사과 아님 <b>${n - a.length}</b>${n < 6 ? ` <span class="warn">— 학습하려면 ${6 - n}개 더 필요해요</span>` : ''}</p>
    <div class="card"><div class="eyebrow" style="color:var(--muted)">색깔별 데이터 (주황 = 사과 · 회색 = 사과 아님)</div><div class="bars">${rows}</div>${notes.length ? `<p class="pp" style="margin-top:10px">${notes.join('<br>')}</p>` : ''}</div>
    ${n ? `<div class="samples">${cards}</div>` : '<p class="pp" style="margin-top:14px">아직 모은 샘플이 없어요. 주황색 빛기둥을 찾아 스캔해 보세요.</p>'}
    <p class="note">「빼기」를 누르면 그 샘플은 과수원 제자리로 돌아가요. 다시 스캔해서 라벨을 새로 붙일 수 있어요.</p>`;
}
async function openDataset(atTerm) {
  G.lock++;
  const body = () => $('#panelBody');
  const btns = atTerm ? [['닫기', ''], ['하비 학습시키기', 'pri']] : [['닫기', 'pri']];
  const pr = panel(datasetHTML(atTerm), btns, true);
  body().onclick = e => {
    const f = e.target.closest('[data-flip]'), d = e.target.closest('[data-del]');
    if (f) { const s = S1.samples.find(x => x.id === +f.dataset.flip); s.label = s.label === 'apple' ? 'not' : 'apple'; Snd.play('blip'); }
    else if (d) { const i = S1.samples.findIndex(x => x.id === +d.dataset.del); const s = S1.samples.splice(i, 1)[0]; const sp = world.spots[s.spot]; sp.got = false; sp.g.visible = true; sp.g.scale.setScalar(1); sp.g.position.set(...sp.home); sp.ring.visible = sp.beam.visible = true; Snd.play('blip'); }
    else return;
    const y = $('#panelCard').scrollTop; body().innerHTML = datasetHTML(atTerm); $('#panelCard').scrollTop = y; updateTray(); setObj(obj1());
  };
  const k = await pr; body().onclick = null; G.lock--;
  return atTerm && k === 1;
}

async function termAction() {
  const n = S1.samples.length;
  if (n < 6) { await talk('bit', `지금 샘플이 ${n}개예요. 하비를 학습시키려면 적어도 6개가 필요해요. 주황색 빛기둥을 더 찾아봐요!`); return; }
  const go = await openDataset(true);
  if (!go) return;
  if (S1.samples.length < 6) { await talk('bit', '샘플이 6개보다 적어졌어요. 조금 더 모아 와요!'); return; }
  await trainAndTest();
}

function drawFeatureSpace(cv) {
  const x = cv.getContext('2d'), W = cv.width, H = cv.height, L = 90, T = 34, cw = (W - L - 16) / 3, ch = (H - T - 16) / 2;
  const cols = ['빨강', '초록', '노랑'], rows = ['꼭지 있음', '꼭지 없음'];
  const pts = S1.samples.map(s => { const Tt = TYPES[s.type]; const ci = cols.indexOf(Tt.color), ri = Tt.stem ? 0 : 1; const h = (s.id * 9301 + 49297) % 233280 / 233280, h2 = (s.id * 7919 + 131) % 1000 / 1000; return { s, px: L + ci * cw + 26 + h * (cw - 52), py: T + ri * ch + 24 + h2 * (ch - 48) }; });
  const start = performance.now();
  const frame = now => {
    const el = (now - start) / 1000;
    x.fillStyle = '#081014'; x.fillRect(0, 0, W, H);
    x.font = '600 15px "IBM Plex Mono", monospace'; x.fillStyle = '#8da4ab'; x.textAlign = 'center';
    cols.forEach((c, i) => x.fillText(c, L + i * cw + cw / 2, 22));
    x.textAlign = 'right'; rows.forEach((r, i) => x.fillText(r, L - 12, T + i * ch + ch / 2 + 5));
    x.strokeStyle = '#264049'; x.lineWidth = 1;
    for (let i = 0; i <= 3; i++) { x.beginPath(); x.moveTo(L + i * cw, T); x.lineTo(L + i * cw, T + 2 * ch); x.stroke(); }
    for (let i = 0; i <= 2; i++) { x.beginPath(); x.moveTo(L, T + i * ch); x.lineTo(L + 3 * cw, T + i * ch); x.stroke(); }
    pts.forEach((p, i) => {
      const a = clamp((el - i * .18) / .35, 0, 1); if (!a) return;
      const r = 13 * (a < 1 ? 1 + Math.sin(a * Math.PI) * .5 : 1);
      x.globalAlpha = a; x.beginPath(); x.arc(p.px, p.py, r, 0, Math.PI * 2); x.fillStyle = TYPES[p.s.type].css; x.fill();
      x.lineWidth = 3; x.strokeStyle = p.s.label === 'apple' ? '#ffb13b' : '#9fb0b5'; x.setLineDash(p.s.label === 'apple' ? [] : [4, 3]); x.stroke(); x.setLineDash([]);
      x.fillStyle = '#e3edef'; x.font = '600 12px "IBM Plex Mono", monospace'; x.textAlign = 'left'; x.fillText('#' + p.s.id, p.px + 17, p.py + 4); x.globalAlpha = 1;
    });
    if (el < pts.length * .18 + .6 && !$('#panel').hidden) requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}

async function trainAndTest() {
  const W = world; S1.attempts++;
  Snd.play('learn');
  const pr = panel(`<div class="eyebrow">학습 중 · 시도 ${S1.attempts}회째</div><div class="ph">하비가 데이터를 특징대로 정리하고 있어요</div>
    <p class="pp">점 하나가 샘플 하나예요. 실선 테두리는 「사과」, 점선 테두리는 「사과 아님」 라벨이에요. 하비는 새 과일을 보면 이 중에서 <b>가장 닮은</b> 샘플을 찾아 그 라벨을 따라요. (표에는 안 보이지만 꽃받침, 이음선, 모양도 함께 비교해요.)</p>
    <canvas id="fsp" class="fspace" width="640" height="290" aria-label="특징 공간 그림"></canvas>`, [['테스트 시작', 'pri']], true);
  drawFeatureSpace($('#fsp'));
  await pr;
  // --- 3D test run ---
  W.haviToss = false; W.bitFollow = false; W.bit.g.position.set(-3, 1.6, -5.6);
  placePlayer(-.8, -3.1, -.06, -.2);
  await talk('havi', '새 학습 데이터로 재학습을 마쳤습니다. 처음 보는 테스트 과일 6개를 분류합니다.');
  const results = [];
  for (const type of TEST_SET) {
    const f = makeFruit(type, 1.2); f.position.set(-5.4, .96, -8); W.testGroup.add(f); W.beltOn = true;
    await tween(1300, k => { f.position.x = lerp(-5.4, 1.2, k); f.rotation.z = -k * 6; }, t => t);
    W.beltOn = false; W.havi.eyeMat.color.setHex(0xffffff); await sleep(300);
    const p = predict(type, S1.samples), ok = (p.label === 'apple') === TYPES[type].apple;
    const sp = textSprite(LAB(p.label), p.label === 'apple' ? '#ffb13b' : '#c9d6d9'); sp.position.set(1.2, 1.8, -8); W.testGroup.add(sp);
    W.havi.eyeMat.color.setHex(ok ? 0x8bd67f : 0xff6d5a); Snd.play(ok ? 'ok' : 'bad');
    await sleep(750);
    const to = p.label === 'apple' ? new THREE.Vector3(2.4, .15, -6.6) : new THREE.Vector3(4.1, .6, -7.2), from = f.position.clone();
    W.havi.arm.rotation.y = -.8;
    await tween(650, k => f.position.set(lerp(from.x, to.x, k), lerp(from.y, to.y, k) + Math.sin(k * Math.PI) * 1.1, lerp(from.z, to.z, k)), t => t);
    W.havi.arm.rotation.y = 0; W.testGroup.remove(sp);
    results.push({ type, pred: p.label, ok, nn: p.nn });
  }
  const score = results.filter(r => r.ok).length;
  const reason = r => {
    if (r.ok) return `<span class="okc">가장 닮은 샘플 #${r.nn.id}(${TYPES[r.nn.type].n})이 「${LAB(r.nn.label)}」</span>`;
    if (!r.nn) return '학습 데이터가 없어요';
    if (r.nn.type === r.type) return `샘플 #${r.nn.id}에 「${LAB(r.nn.label)}」 라벨이 붙어 있었어요. <b>라벨이 틀린 것 같아요.</b>`;
    return `똑같은 종류의 데이터가 없어서, 가장 닮은 샘플 #${r.nn.id}(${TYPES[r.nn.type].n}, 「${LAB(r.nn.label)}」)을 보고 판단했어요. <b>${josa(TYPES[r.type].n, '이', '가')} 들어간 데이터가 필요해요.</b>`;
  };
  await panel(`<div class="eyebrow">테스트 결과 · 시도 ${S1.attempts}회째</div><div class="ph">${score} / 6 맞힘</div>
    <div class="tbl-wrap"><table class="res"><thead><tr><th>테스트 과일</th><th>하비의 판단</th><th>결과</th><th>왜 그렇게 판단했을까?</th></tr></thead><tbody>
    ${results.map(r => `<tr><td><span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${TYPES[r.type].css};margin-right:6px"></span>${TYPES[r.type].n}</td><td>${LAB(r.pred)}</td><td>${r.ok ? '<span class="okc">맞음</span>' : '<span class="warn">틀림</span>'}</td><td style="font-size:13px;line-height:1.55">${reason(r)}</td></tr>`).join('')}
    </tbody></table></div>`, [[score === 6 ? '계속' : '데이터 보강하러 가기', 'pri']], true);
  W.testGroup.children.slice().forEach(c => W.testGroup.remove(c));
  if (score === 6) return stageClear(results);
  // failure → coach
  G.lock++;
  const wrongs = results.filter(r => !r.ok);
  const labelErr = wrongs.some(r => r.nn && r.nn.type === r.type);
  await talk('havi', `분류 정확도 ${Math.round(score / 6 * 100)}%. 아직 틀린 판단이 있습니다.`);
  if (labelErr) await talk('bit', '어떤 샘플은 라벨이 잘못 붙어 있나 봐요. 데이터셋에서 「라벨 바꾸기」로 고칠 수 있어요.');
  if (wrongs.some(r => r.nn && r.nn.type !== r.type)) await talk('bit', `하비가 한 번도 못 본 종류가 있었어요. ${wrongs.filter(r => r.nn && r.nn.type !== r.type).map(r => TYPES[r.type].n).join(', ')} 같은 데이터를 더 찾아봐요!`);
  await talk('bit', '틀린 이유를 알면 어떤 데이터가 필요한지 알 수 있어요. AI를 만드는 사람들도 이렇게 계속 고쳐 나가요.');
  W.haviToss = true; W.bitFollow = true; G.lock--;
  setObj(obj1());
}

async function stageClear(results) {
  const W = world; G.lock++;
  W.havi.eyeMat.color.setHex(0x8bd67f); Snd.play('win');
  await lines([['havi', '분류 정확도 100%. 초록 사과: 사과. 노란 사과: 사과. 토마토와 레몬, 라임: 사과 아님.'], ['havi', '폐기통의 사과들을 다시 시장으로 보내겠습니다. 고맙습니다, {name}님.']]);
  W.binPile.forEach((f, i) => { const from = f.position.clone(), to = new THREE.Vector3(2.4 + (Math.random() - .5) * .8, .15, -6.6 + (Math.random() - .5) * .5); setTimeout(() => tween(700, k => f.position.set(lerp(from.x, to.x, k), lerp(from.y, to.y, k) + Math.sin(k * Math.PI) * 1.2, lerp(from.z, to.z, k)), t => t), i * 120); });
  await sleep(1400);
  await talk('bit', '해냈어요! 하비는 그대로인데, 데이터만 바꿨더니 판단이 완전히 달라졌어요.');
  const opts = ['하비는 고장 난 로봇이니까 새 로봇으로 바꾼다', '데이터를 모을 때 여러 경우가 골고루 들어갔는지 사람이 확인한다', 'AI는 똑똑하니까 스스로 고칠 때까지 그냥 둔다'];
  for (; ;) {
    const k = await choose('bit', '{name}님, 하비가 초록 사과를 버리는 일이 다시 생기지 않으려면 무엇이 가장 중요할까요?', opts);
    if (S1.choice === null) S1.choice = k;
    if (k === 1) { Snd.play('ok'); await lines([['bit', '맞아요! AI를 만드는 사람은 데이터가 한쪽으로 치우치지 않았는지, 라벨이 맞는지 꼭 확인해야 해요.'], ['bit', 'AI를 쓰는 우리도 AI가 이상한 판단을 하면 「왜 그럴까? 무엇을 보고 배웠을까?」 하고 물을 수 있어야 하고요.']]); break; }
    if (k === 0) await talk('bit', '새 로봇도 같은 데이터로 배우면 똑같이 초록 사과를 버릴 거예요. 문제는 로봇이 아니라 데이터였잖아요.');
    if (k === 2) await talk('bit', '하비는 「내 데이터에 초록 사과가 없네」 하고 스스로 알아차리지 못했어요. 누군가 확인해 줘야 해요.');
  }
  await panel(`<div class="eyebrow">이야기 밖, 진짜 세상</div><div class="ph">데이터리움은 지어낸 도시예요</div>
    <p class="pp">코어, 비트, 하비는 모두 이 게임 속 이야기예요. 하지만 「데이터가 치우치면 AI의 판단도 치우친다」는 건 실제로 일어나는 일이에요.</p>
    <div class="card real"><b>얼굴 인식</b><p class="pp">2018년 미국 MIT 미디어랩의 연구(Gender Shades)에서, 여러 회사의 얼굴 분석 AI가 피부색이 밝은 남성보다 피부색이 어두운 여성의 성별을 훨씬 자주 틀린다는 결과가 나왔어요. 학습 데이터에 어떤 사람들의 사진이 적게 들어갔는지와 관련이 있다고 설명되었어요.</p></div>
    <div class="card real"><b>음성 인식</b><p class="pp">말소리를 글자로 바꾸는 AI도 학습 데이터에 적게 들어간 사투리, 억양, 어린이 목소리를 더 자주 잘못 알아듣곤 해요.</p></div>
    <div class="card"><div class="eyebrow">생각해 보기</div><p class="pp">우리 주변 AI 가운데 「데이터가 부족해서」 누군가를 잘 못 알아볼 수 있는 것은 무엇일까요? 그런 일이 생기면 누가, 어떻게 고쳐야 할까요?</p></div>`, [['기록 보기', 'pri']], true);
  const n = S1.samples.length, a = S1.samples.filter(s => s.label === 'apple').length, cols = new Set(S1.samples.map(s => TYPES[s.type].color)).size;
  const date = new Date().toLocaleDateString('ko-KR', { year: 'numeric', month: 'long', day: 'numeric' });
  Save.set({ cleared1: true });
  const k = await panel(`<div class="cert"><div class="eyebrow">데이터리움 탐사 기록 · STAGE 1</div><div class="nm">${esc(G.name)}</div>
    <dl class="kv"><dt>모은 샘플</dt><dd>${n}개 (사과 ${a} · 사과 아님 ${n - a})</dd><dt>색의 다양성</dt><dd>${cols}가지 색</dd><dt>학습 시도</dt><dd>${S1.attempts}회</dd><dt>최종 테스트</dt><dd>6 / 6</dd><dt>첫 선택</dt><dd>${opts[S1.choice]}</dd><dt>날짜</dt><dd>${date}</dd></dl>
    <p class="pp" style="margin-top:12px">하비의 학습 데이터를 다시 만들어, 버려질 뻔한 초록·노란 사과를 되찾았습니다.</p></div>`, [['계속', 'pri']]);
  await talk('bit', '그런데 {name}님... 과수원 너머 시장에서 이상한 소문이 들려요. 누군가 데이터에 일부러 가짜 라벨을 붙이고 있대요.');
  G.lock--;
  await banner('NEXT', '가짜 라벨 시장', 'STAGE 2 · 준비 중인 이야기예요');
  G.lock++;
  const e = await panel(`<div class="eyebrow">STAGE 1 완료</div><div class="ph">수고했어요, ${esc(G.name)}님</div><p class="pp">과수원을 더 둘러보거나 처음 화면으로 돌아갈 수 있어요.</p>`, [['처음 화면으로', ''], ['과수원 더 둘러보기', 'pri']]);
  G.lock--;
  if (e === 0) bootTitle(); else { W.bitFollow = true; setObj('자유 탐험 · STAGE 2는 준비 중이에요'); }
}

/* ---------- boot ---------- */
bootTitle();
loop();

</script>
